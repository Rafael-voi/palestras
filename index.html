  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:antialiased}\n    a{color:#9B1B3A;text-decoration:none}\n    a:hover{color:#7C1530}\n    input,select,button,textarea{font-family:inherit}\n    input::placeholder{color:#9A938B}\n    select:focus,input:focus{outline:2px solid #9B1B3A;outline-offset:1px}\n    @keyframes voiPulse{0%{box-shadow:0 0 0 0 rgba(232,163,61,.55),0 12px 26px -12px rgba(0,0,0,.5)}70%{box-shadow:0 0 0 16px rgba(232,163,61,0),0 12px 26px -12px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 0 rgba(232,163,61,0),0 12px 26px -12px rgba(0,0,0,.5)}}\n    @keyframes voiNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}\n    @keyframes voiUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}\n    html{-webkit-text-size-adjust:100%}\n    img{max-width:100%}\n    button,a{touch-action:manipulation}\n  <\u002Fstyle>\n  \n<\u002Fhelmet>\n\n<div style=\"width:100%;min-height:100vh;background:#F4F1ED;display:flex;flex-direction:column;align-items:center\">\n\n<sc-if value=\"{{ mostrarPagina }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"width:100%;display:flex;flex-direction:column;align-items:center\">\n\n  <!-- ===== FAIXA DE URGÊNCIA ===== -->\n  <div style=\"width:100%;background:#E8A33D;display:flex;justify-content:center;padding:11px 18px\">\n    <p style=\"font-size:14px;font-weight:800;color:#2D2D2D;letter-spacing:.01em;text-align:center;line-height:1.35\">PALESTRA GRATUITA · 15 DE OUTUBRO, 19H · ONLINE E AO VIVO<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ===== HERO ===== -->\n  <div data-screen-label=\"Hero\" style=\"width:100%;background:#2D2D2D;display:flex;justify-content:center\">\n    <div style=\"width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr))\">\n\n      <div style=\"padding:34px 24px 40px;display:flex;flex-direction:column;gap:20px;justify-content:center;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n          <span style=\"display:block;width:26px;height:3px;background:#E8A33D\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#E8A33D\">Para quem roda de caminhão<\u002Fspan>\n        <\u002Fdiv>\n\n        <h1 style=\"font-size:clamp(28px,7.6vw,38px);line-height:1.12;font-weight:900;color:#fff;letter-spacing:-.025em;text-wrap:pretty\">Motorista ou ajudante de distribuidora de bebidas? Você pode ter direitos que nunca te disseram.<\u002Fh1>\n\n        <p style=\"font-size:17px;line-height:1.55;color:#C9C3BC;max-width:46ch;text-wrap:pretty\">Uma conversa direta, sem juridiquês, sobre como funciona o pagamento e a rotina nesse tipo de trabalho — para você entender o que a lei diz.<\u002Fp>\n\n        <!-- CTA PRINCIPAL -->\n        <div style=\"display:flex;flex-direction:column;gap:11px;padding-top:4px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ abrir }}\" style=\"width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#B32247 0%,#9B1B3A 100%);color:#fff;border:none;border-radius:7px;padding:18px 22px;cursor:pointer;animation:voiPulse 2.4s ease-out infinite;min-height:70px\" style-hover=\"background:linear-gradient(180deg,#C42750 0%,#AA1E40 100%)\">\n            <span style=\"font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#F6C9A8\">Clique aqui<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:9px;font-size:clamp(17px,4.9vw,21px);font-weight:900;letter-spacing:-.02em;line-height:1.1;text-align:center\">\n              QUERO GARANTIR MINHA VAGA\n              <span style=\"display:inline-block;animation:voiNudge 1.3s ease-in-out infinite;font-size:21px\">→<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center\">\n            <span style=\"font-size:13px;font-weight:700;color:#E8A33D\">100% gratuita<\u002Fspan>\n            <span style=\"font-size:13px;color:#8F8880\">Leva 30 segundos<\u002Fspan>\n            <span style=\"font-size:13px;color:#8F8880\">Link no seu WhatsApp<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;min-height:360px;min-width:0;background:#1F1F1F\">\n        <img src=\"29c8614c-966e-4e0e-a157-68261690b6bb\" alt=\"Rafael Izidoro na cabine de um caminhão de distribuição\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 26%\">\n        <div style=\"position:absolute;left:0;right:0;bottom:0;padding:34px 22px 16px;background:linear-gradient(180deg,rgba(31,31,31,0) 0%,rgba(31,31,31,.9) 62%)\">\n          <div style=\"font-size:15px;font-weight:800;color:#fff;line-height:1.3\">Rafael Izidoro<\u002Fdiv>\n          <div style=\"font-size:13px;color:#D8D2CB;line-height:1.4\">Advogado, VOI Advogados<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== ISSO É VOCÊ ===== -->\n  <div data-screen-label=\"Identificação\" style=\"width:100%;background:#F4F1ED;display:flex;justify-content:center;padding:48px 22px 8px\">\n    <div style=\"width:100%;max-width:760px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9B1B3A\">Isso é você?<\u002Fspan>\n        <h2 style=\"font-size:clamp(24px,6.2vw,30px);line-height:1.18;font-weight:900;color:#2D2D2D;letter-spacing:-.025em;text-wrap:pretty\">Se você já passou por alguma dessas, vale participar<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ situacoes }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:14px;align-items:flex-start;padding:17px 18px;background:#fff;border-left:3px solid #9B1B3A;border-radius:0 4px 4px 0\">\n            <span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#F4E2E7;color:#9B1B3A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-top:1px\">{{ item.n }}<\u002Fspan>\n            <p style=\"font-size:16px;line-height:1.5;color:#3A3A3A;font-weight:500;text-wrap:pretty;min-width:0\">{{ item.texto }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <p style=\"font-size:15px;line-height:1.6;color:#6B645C;text-wrap:pretty\">Muita gente sente que algo está errado, mas não sabe como isso se chama. A palestra serve justamente para isso: dar nome às coisas.<\u002Fp>\n\n      <!-- CTA INTERMEDIÁRIO -->\n      <button type=\"button\" sc-camel-on-click=\"{{ abrir }}\" style=\"width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;background:#2D2D2D;color:#fff;border:none;border-radius:7px;padding:17px 20px;cursor:pointer;min-height:66px\" style-hover=\"background:#3D3D3D\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#E8A33D\">Clique aqui<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:9px;font-size:18px;font-weight:900;letter-spacing:-.02em\">Me inscrever na palestra <span style=\"font-size:19px\">→<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== FOTO DE APOIO ===== -->\n  <div style=\"width:100%;display:flex;justify-content:center;padding:36px 22px 0\">\n    <div style=\"width:100%;max-width:760px;position:relative;border-radius:6px;overflow:hidden;background:#1F1F1F\">\n      <img src=\"9a8059d9-c4c3-4a39-9f73-5b698181da24\" alt=\"Rafael Izidoro cumprimentando um trabalhador da distribuição\" loading=\"lazy\" style=\"width:100%;height:auto;display:block;max-height:360px;object-fit:cover;object-position:50% 34%\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;padding:40px 20px 15px;background:linear-gradient(180deg,rgba(31,31,31,0) 0%,rgba(31,31,31,.88) 60%)\">\n        <p style=\"font-size:14px;font-weight:600;color:#fff;line-height:1.45;text-wrap:pretty\">Quem roda na distribuição conhece a rotina. A palestra fala dessa rotina.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== SOBRE A PALESTRA ===== -->\n  <div data-screen-label=\"Sobre a palestra\" style=\"width:100%;display:flex;justify-content:center;padding:36px 22px 48px\">\n    <div style=\"width:100%;max-width:760px;background:#fff;border-radius:6px;padding:30px 24px;display:flex;flex-direction:column;gap:22px;border-top:4px solid #2D2D2D\">\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9B1B3A\">Sobre a palestra<\u002Fspan>\n        <h2 style=\"font-size:clamp(23px,5.8vw,28px);line-height:1.18;font-weight:900;color:#2D2D2D;letter-spacing:-.025em;text-wrap:pretty\">O que vamos conversar<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ topicos }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <span style=\"flex:none;width:7px;height:7px;background:#9B1B3A;border-radius:50%;margin-top:8px\"><\u002Fspan>\n            <p style=\"font-size:16px;line-height:1.55;color:#3A3A3A;min-width:0;text-wrap:pretty\">{{ t.texto }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px solid #EAE5DF\">\n        <span style=\"font-size:13px;font-weight:700;color:#3A3A3A;background:#F4F1ED;padding:8px 13px;border-radius:3px\">Ao vivo<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:700;color:#3A3A3A;background:#F4F1ED;padding:8px 13px;border-radius:3px\">Espaço para perguntas<\u002Fspan>\n id #fff;border-radius:4px;min-height:52px\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:13.5px;font-weight:700;color:#E4DFD9\">WhatsApp<\u002Fspan>\n        <input name=\"whatsapp\" type=\"tel\" required=\"true\" placeholder=\"(00) 00000-0000\" style=\"width:100%;padding:14px;font-size:16px;color:#2D2D2D;background:#fff;border:1.5px solid #fff;border-radius:4px;min-height:52px\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:13.5px;font-weight:700;color:#E4DFD9\">Cidade<\u002Fspan>\n        <input name=\"cidade\" type=\"text\" required=\"true\" placeholder=\"Onde você trabalha\" style=\"width:100%;padding:14px;font-size:16px;color:#2D2D2D;background:#fff;border:1.5px solid #fff;border-radius:4px;min-height:52px\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:13.5px;font-weight:700;color:#E4DFD9\">Sua função<\u002Fspan>\n        <sc-raw-select name=\"funcao\" required=\"true\" style=\"width:100%;padding:14px;font-size:16px;color:#2D2D2D;background:#fff;border:1.5px solid #fff;border-radius:4px;min-height:52px;appearance:none\">\n          <option value=\"\">Selecione<\u002Foption>\n          <option value=\"Motorista de distribuição\">Motorista de distribuição<\u002Foption>\n          <option value=\"Ajudante\">Ajudante<\u002Foption>\n          <option value=\"Conferente de carga\">Conferente de carga<\u002Foption>\n          <option value=\"Outro\">Outro<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n\n      <button type=\"submit\" style=\"width:100%;background:linear-gradient(180deg,#B32247 0%,#9B1B3A 100%);color:#fff;font-size:19px;font-weight:900;padding:18px;border:none;border-radius:6px;min-height:60px;cursor:pointer;letter-spacing:-.02em;margin-top:4px;box-shadow:0 10px 24px -12px rgba(155,27,58,.9)\" style-hover .5L19 8\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <h2 style=\"font-size:31px;line-height:1.14;font-weight:900;color:#fff;letter-spacing:-.025em;text-wrap:pretty\">Vaga reservada, {{ primeiroNome }}!<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.55;color:#C9C3BC;text-wrap:pretty\">Sua inscrição para a palestra de <strong style=\"color:#fff;font-weight:800\">15 de outubro, às 19h<\u002Fstrong>, está confirmada. O link de acesso chega no seu WhatsApp antes do dia.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"width:100%;height:1px;background:#454545\"><\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:15px;width:100%\">\n      <div style=\"display:flex;flex-direction:column;gap:7px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#E8A33D\">Próximo passo<\u002Fspan>\n        <p style=\"font-size:16px;line-height:1.55;color:#E4DFD9;text-wrap:pretty\">Entre na comunidade no WhatsApp para receber os lembretes e avisos antes da palestra.<\u002Fp>\n      <\u002Fdiv>\n\n      <a href=\"{{ whatsappUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:linear-gradient(180deg,#B32247 0%,#9B1B3A 100%);color:#fff;font-size:19px;font-weight:900;padding:18px 22px;border-radius:6px;min-height:60px;letter-spacing:-.02em;box-shadow:0 10px 24px -12px rgba(155,27,58,.9)\" style-hover=\"background:linear-gradient(180deg,#C42750 0%,#AA1E40 100%)\">Entrar na comunidade <span style=\"font-size:20px\">→<\u002Fspan><\u002Fa>\n\n      <p style=\"font-size:13px;line-height:1.55;color:#8F8880\">Você pode sair da comunidade quando quiser.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n  <!-- ===== RODAPÉ ===== -->\n  <div data-screen-label=\"Rodapé\" style=\"width:100%;background:#F4F1ED;display:flex;justify-content:center;padding:36px 22px calc(112px + env(safe-area-inset-bottom));border-top:1px solid #E2DCD5\">\n    <div style=\"width:100%;max-width:760px;display:flex;flex-direction:column;gap:17px\">\n      <img src=\"fe0f9c88-690a-4529-bf45-bb25ac97624b\" alt=\"VOI Advogados\" style=\"width:132px;height:auto;display:block\">\n      <p style=\"font-size:14px;line-height:1.6;color:#3A3A3A;font-weight:700;text-wrap:pretty\">VOI Advogados — Rafael Izidoro Bello Gonçalves Silva, OAB/SP 259.261<\u002Fp>\n      <p style=\"font-size:13px;line-height:1.65;color:#6B645C;text-wrap:pretty\">Conteúdo estritamente informativo. Esta página não constitui oferta de serviços, consulta jurídica ou garantia de resultado. Cada situação de trabalho é analisada individualmente.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:14px 0;border-top:1px solid #E2DCD5;border-bottom:1px solid #E2DCD5\">\n        <span style=\"font-size:13.5px;color:#6B645C;line-height:1.5\">Problema para se inscrever?<\u002Fspan>\n        <a href=\"{{ suporteUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13.5px;font-weight:700;color:#9B1B3A;line-height:1.5;border-bottom:1px solid rgba(155,27,58,.4)\">Fale conosco<\u002Fa>\n        <span style=\"font-size:12.5px;color:#9A938B;line-height:1.5\">— apenas dúvidas sobre a inscrição<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;line-height:1.65;color:#6B645C;text-wrap:pretty\">Privacidade e LGPD: coletamos nome, telefone, cidade e função apenas para enviar o acesso à palestra e os avisos relacionados a ela. Os dados não são vendidos nem compartilhados com terceiros e podem ser removidos a pedido, pelo mesmo WhatsApp de contato.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://chat.whatsapp.com/Lc90NmJk2np9KukSrDaffK&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Integração&quot;},&quot;suporteUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wa.me/5519993023208?text=Ol%C3%A1!%20Trabalho%20com%20entrega%20de%20bebidas%20e%20tenho%20d%C3%BAvidas%20sobre%20a%20inscri%C3%A7%C3%A3o%20na%20palestra%20do%20dia%2015%2F10.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Integração&quot;}}\">\nclass Component extends DCLogic {\n  state = { enviado: false, modal: false, nome: '', rolou: false };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const rolou = (window.scrollY || 0) > 460;\n      if (rolou !== this.state.rolou) this.setState({ rolou });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.modal !== this.state.modal) {\n      document.body.style.overflow = this.state.modal ? 'hidden' : '';\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    document.body.style.overflow = '';\n  }\n\n  renderVals() {\n    const situacoes = [\n      { n: 1, texto: 'Sua caixaria, variável ou prêmio de produtividade nunca bate com o que foi prometido' },\n      { n: 2, texto: 'Você foi rebaixado de função ou mudado de posto como se fosse castigo' },\n      { n: 3, texto: 'Além da sua função, você também faz outra tarefa — conferência, cobrança de valores — sem receber por isso' },\n      { n: 4, texto: 'A empresa desconta \"vale físico\" ou \"vale financeiro\" do seu contracheque sem explicação clara' },\n      { n: 5, texto: 'Você carrega peso pesado todos os dias e já sente dor ou lesão' }\n    ];\n    const topicos = [\n      { texto: 'Como a lei trata a parte variável do pagamento — caixaria, prêmios e metas — e o que precisa estar claro no contracheque.' },\n      { texto: 'O que caracteriza acumular duas funções no mesmo turno e como isso é visto juridicamente.' },\n      { texto: 'Descontos no contracheque: quais a empresa pode fazer e quais precisam de justificativa.' },\n      { texto: 'Mudança de função ou de posto: em que situações isso pode ser questionado.' },\n      { texto: 'Esforço físico repetido, dor e lesão: quais registros e cuidados importam no dia a dia.' }\n    ];\n    const nome = (this.state.nome || '').trim();\n    return {\n      situacoes,\n      topicos,\n      enviado: this.state.enviado,\n      modalAberto: this.state.modal && !this.state.enviado,\n      mostrarPagina: !this.state.enviado,\n      mostrarBarra: !this.state.enviado && !this.state.modal,\n      mostrarBalao: !this.state.enviado && !this.state.modal && this.state.rolou,\n      primeiroNome: nome ? nome.split(/\\s+/)[0] : 'tudo certo',\n      whatsappUrl: this.props.whatsappUrl ?? 'https://chat.whatsapp.com/Lc90NmJk2np9KukSrDaffK',\n      suporteUrl: this.props.suporteUrl ?? 'https://wa.me/5519993023208?text=Ol%C3%A1!%20Trabalho%20com%20entrega%20de%20bebidas%20e%20tenho%20d%C3%BAvidas%20sobre%20a%20inscri%C3%A7%C3%A3o%20na%20palestra%20do%20dia%2015%2F10.',\n      abrir: () => this.setState({ modal: true }),\n      fechar: () => this.setState({ modal: false }),\n      enviar: (e) => {\n        e.preventDefault();\n        const fd = new FormData(e.target);\n        this.setState({ enviado: true, modal: false, nome: fd.get('nome') || '' });\n        if (typeof window !== 'undefined') window.scrollTo(0, 0);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
